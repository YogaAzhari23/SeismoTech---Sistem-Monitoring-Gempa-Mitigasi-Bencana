<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Gempa | Yoga Guard Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-200 bg-slate-950">

    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-[1000]">
        <div class="max-w-[1200px] mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-red-600 rounded flex items-center justify-center font-header font-bold text-lg">ST</div>
                <h1 class="font-header text-lg font-bold tracking-wider text-white">Seismo<span class="text-red-500">Tech</span></h1>
            </div>
            <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white transition">KEMBALI KE BERANDA</a>
        </div>
    </nav>

    <main class="max-w-[1200px] mx-auto p-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
            <div class="bg-slate-800/50 px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="font-header text-sm font-bold tracking-wider uppercase">Data 15 Gempa Terakhir (M 5.0+)</h3>
                <span class="text-[10px] text-slate-500">Sumber: BMKG Indonesia</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-950 text-slate-500 uppercase text-[10px] font-bold">
                        <tr>
                            <th class="px-6 py-4">Waktu Kejadian</th>
                            <th class="px-6 py-4">Magnitude</th>
                            <th class="px-6 py-4">Kedalaman</th>
                            <th class="px-6 py-4">Lokasi / Wilayah</th>
                            <th class="px-6 py-4">Potensi Tsunami</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableFull" class="divide-y divide-slate-800">
                        <!-- Data akan diisi oleh JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
